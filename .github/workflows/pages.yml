name: Deploy to GitHub Pages

# Publishes two things to GitHub Pages over a publicly trusted HTTPS origin (the R1
# WebView rejects LAN self-signed certs; see H19):
#   - the S02 owned-R1 capability probe (demo/) at the site root
#   - the S12 immutable production release at /r1/v<version>/ with a vendored install QR
# Both hold no secrets and reach no daemon; production Relay transport is separate.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Package and verify the immutable release
        run: npm run verify:release
        env:
          RELEASE_BASE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Assemble site (probe at root, immutable release under /r1)
        run: |
          rm -rf _site
          mkdir -p _site/r1
          cp -R demo/. _site/
          cp -R dist/r1/. _site/r1/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
