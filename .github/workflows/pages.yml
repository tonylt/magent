name: Deploy probe to GitHub Pages

# Publishes the S02 owned-R1 capability probe (demo/) to GitHub Pages so the R1
# WebView can install it from a publicly trusted HTTPS origin (no self-signed CA,
# no disabled certificate validation). The probe touches no daemon and holds no
# secrets, so public static hosting is safe. Production Relay transport is separate.

on:
  push:
    branches: [main]
    paths:
      - demo/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload probe artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
