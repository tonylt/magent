<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=240, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090a0a">
  <title>Paseo Creation Probe</title>
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <main id="app" aria-live="polite"><pre id="boot" style="margin:0;padding:12px;color:#f4f2ec;background:#090a0a;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;">Paseo Probe v2
Starting&#8230;</pre></main>
  <script>
    /* Classic (non-module) diagnostic. Runs even if the WebView cannot parse ES
       modules or top-level await, so boot failures are visible on device. The
       static banner above is always painted with inline styles, so a black screen
       means old cached content or the page did not load at all. */
    (function () {
      var boot = document.getElementById("boot");
      function show(msg) { if (boot) boot.textContent = "Paseo Probe v2\n" + msg; }
      window.__probeStarted = false;
      window.addEventListener("error", function (event) {
        var msg = (event && (event.message || (event.error && event.error.message))) || "unknown";
        show("SCRIPT ERROR: " + msg + (event && event.filename ? ("\n" + event.filename) : ""));
      });
      window.addEventListener("unhandledrejection", function (event) {
        var reason = event && event.reason;
        show("PROMISE ERROR: " + ((reason && (reason.message || String(reason))) || "unknown"));
      });
      setTimeout(function () {
        if (!window.__probeStarted) {
          show("MODULE DID NOT START in 6s.\nURL: " + location.href
            + "\nWebView may not support ES modules / top-level await, or a stale version is cached.");
        }
      }, 6000);
    })();
  </script>
  <script type="module" src="app.js?v=6"></script>
</body>
</html>
